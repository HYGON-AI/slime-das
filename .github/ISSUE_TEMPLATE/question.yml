name: 使用问题
description: 提出 slime-das 的 HCU 安装、配置或运行问题。
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        提问前请先阅读 [HCU 用户指南](https://github.com/HYGON-AI/slime-das/blob/main/hcu_example/user_guide.md) 和 README。

  - type: textarea
    id: question
    attributes:
      label: 问题描述
      description: 请说明你想完成的操作、实际结果及期望结果。
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 已尝试的操作
      description: 请列出已执行的命令、配置修改和观察到的结果。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      value: |
        - slime-das 版本或 commit：
        - HCU 型号与数量：
        - HCU 驱动和运行时版本：
        - Python / PyTorch 版本：
        - SGLang / Megatron-LM 版本：
        - 操作系统：

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可附上已脱敏的日志、配置或截图。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已阅读 HCU 用户指南和 README。
          required: true
        - label: 我已搜索 [现有 Issue](https://github.com/HYGON-AI/slime-das/issues)。
          required: true
