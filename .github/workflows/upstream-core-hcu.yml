name: Upstream Core Tests (HCU)

on:
  # Label-triggered: a maintainer adding `run-ci` starts the HCU upstream core
  # scenarios. Opening, pushing, reopening or marking the PR ready for review
  # no longer does.
  pull_request_target:
    types: [labeled]
    branches:
      - main
    paths:
      - "slime/**"
      - "slime_plugins/**"
      - "hcu_example/**"
      - "scripts/**"
      - "train.py"
      - "train_async.py"
      - "requirements.txt"
      - "setup.py"
      - ".github/workflows/upstream-core-hcu.yml"
      - ".github/workflows/README.md"
  workflow_dispatch:

concurrency:
  # Unrelated label events get a throwaway group: they skip every job and must
  # not cancel or queue behind the HCU run they share a PR with.
  group: upstream-core-hcu-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'run-ci' && github.run_id || 'checks' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upstream-core:
    name: HCU upstream core (${{ matrix.scenario }})
    # HCU CI runs only when `run-ci` is added (the workflow accepts no other
    # PR event); draft pull requests are still skipped.
    if: github.event_name != 'pull_request_target' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft == false)
    # ARC K8s pool: the job template injects the eight HCU devices, /dev/shm,
    # /opt/hyhal, /public and /ci_public, and the job runs inside the HCU image
    # (no docker-in-job).
    runs-on: hygon-bw1100-8card
    timeout-minutes: 120
    container:
      image: ${{ vars.HCU_BASE_IMAGE }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario:
          - fully-async
          - ppo-disaggregate
          - ppo-colocate
          - checkpoint
          - checkpoint-extended
          - streaming-partial
    env:
      CI_MODEL_PATH: ${{ vars.CI_MODEL_PATH }}
      SLIME_ROOT: ${{ github.workspace }}
      HCU_MEGATRON_ROOT: /opt/hcu-megatron
      DATA_ROOT: /opt/slime-data
      # The model directory is read directly from the pod mount, not bind-mounted
      # from a host path the way the old docker launcher did.
      MODEL_PATH: ${{ vars.CI_MODEL_PATH }}
      SAVE_ROOT: ${{ github.workspace }}/.hcu-core/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.scenario }}/checkpoints
      LOG_DIR: ${{ github.workspace }}/.hcu-core/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.scenario }}/logs
      NODE_IP: "127.0.0.1"
      NUM_GPUS: "8"
      HIP_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      ACTOR_NUM_GPUS_PER_NODE: "4"
      ROLLOUT_NUM_GPUS: "4"
      ROLLOUT_NUM_GPUS_PER_ENGINE: "4"
      SUBMIT_MODE: direct
      WANDB_MODE: disabled
      TOKENIZERS_PARALLELISM: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      XDG_CACHE_HOME: /tmp/slime-hcu-cache

    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CI_MODEL_PATH; do
            test -n "${!name:-}" || {
              echo "::error::Repository variable ${name} is not configured."
              exit 2
            }
          done
          test -f "${CI_MODEL_PATH}/config.json" || {
            echo "::error::Model config is not readable: ${CI_MODEL_PATH}/config.json"
            exit 2
          }
          python3 -c 'import torch; count = torch.cuda.device_count(); print(f"devices={count}"); assert count >= 8'

      - name: Run HCU scenario
        shell: bash
        run: bash hcu_example/run_hcu_ci.sh "${{ matrix.scenario }}"

      - name: Upload HCU core logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slime-das-hcu-upstream-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.hcu-core/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.scenario }}/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Clean HCU core state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          scenario_root="${GITHUB_WORKSPACE}/.hcu-core/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.scenario }}"
          rm -rf -- "${scenario_root}/checkpoints" "${scenario_root}/cache"
