name: PR Test (HCU)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - "slime/**"
      - "slime_plugins/**"
      - "hcu_example/**"
      - "scripts/**"
      - "tools/**"
      - "train.py"
      - "train_async.py"
      - "requirements.txt"
      - "setup.py"
      - ".github/workflows/pr-test-hcu.yml"
      - ".github/workflows/README.md"
  workflow_dispatch:

concurrency:
  group: pr-test-hcu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hcu-qwen3-4b-smoke:
    name: HCU Qwen3-4B single-node smoke
    if: github.event_name != 'pull_request_target' || github.event.pull_request.draft == false
    runs-on:
      group: ci-general
      labels: [self-hosted, ci]
    timeout-minutes: 60
    env:
      CI_IMAGE: ${{ vars.HCU_BASE_IMAGE }}
      CI_IMAGE_ARCHIVE: ${{ vars.HCU_BASE_IMAGE_ARCHIVE }}
      CI_MODEL_PATH: ${{ vars.CI_MODEL_PATH }}
      HCU_IMAGE_ID: sha256:522679376cfe815290508512ec3b02ab6d01fa21426bafc18b35c62a293eea3c
      HCU_CONTAINER_NAME: slime-das-hcu-${{ github.run_id }}-${{ github.run_attempt }}-smoke
      SLIME_ROOT: ${{ github.workspace }}
      HCU_MEGATRON_ROOT: /opt/hcu-megatron
      DATA_ROOT: /opt/slime-data
      MODEL_PATH: /model
      SAVE_ROOT: ${{ github.workspace }}/.hcu-smoke/${{ github.run_id }}-${{ github.run_attempt }}/checkpoints
      LOG_DIR: ${{ github.workspace }}/.hcu-smoke/${{ github.run_id }}-${{ github.run_attempt }}/logs
      NODE_IP: "127.0.0.1"
      NUM_GPUS: "8"
      HIP_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      NUM_ROLLOUT: "1"
      ROLLOUT_BATCH_SIZE: "1"
      N_SAMPLES_PER_PROMPT: "1"
      N_SAMPLES_PER_EVAL_PROMPT: "1"
      GLOBAL_BATCH_SIZE: "1"
      ROLLOUT_MAX_RESPONSE_LEN: "256"
      EVAL_MAX_RESPONSE_LEN: "256"
      WANDB_MODE: disabled
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Validate configuration and load HCU image
        shell: bash
        run: |
          set -euo pipefail
          for name in CI_IMAGE CI_IMAGE_ARCHIVE CI_MODEL_PATH; do
            test -n "${!name:-}" || {
              echo "::error::Repository variable ${name} is not configured."
              exit 2
            }
          done
          test -f "${CI_MODEL_PATH}/config.json" || {
            echo "::error::Model config is not readable: ${CI_MODEL_PATH}/config.json"
            exit 2
          }
          if ! docker image inspect "${CI_IMAGE}" >/dev/null 2>&1; then
            test -r "${CI_IMAGE_ARCHIVE}" || {
              echo "::error::Image archive is not readable: ${CI_IMAGE_ARCHIVE}"
              exit 2
            }
            docker load --input "${CI_IMAGE_ARCHIVE}"
          fi
          loaded_id="$(docker image inspect "${CI_IMAGE}" --format '{{.Id}}')"
          [[ "${loaded_id}" == "${HCU_IMAGE_ID}" ]]
          echo "Using bundled HCU image: ${CI_IMAGE} (${loaded_id})"

      - name: Run Qwen3-4B minimum rollout and training step
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${SAVE_ROOT}" "${LOG_DIR}"
          cleanup_container() {
            docker rm --force "${HCU_CONTAINER_NAME}" >/dev/null 2>&1 || true
          }
          trap cleanup_container EXIT

          docker run --rm --pull=never \
            --name "${HCU_CONTAINER_NAME}" \
            --ipc=host \
            --shm-size=128g \
            --device=/dev/kfd \
            --device=/dev/mkfd \
            --device=/dev/dri \
            --group-add=video \
            --cap-add=SYS_PTRACE \
            --security-opt=seccomp=unconfined \
            --ulimit=memlock=-1:-1 \
            --privileged \
            --volume /opt/hyhal:/opt/hyhal:ro \
            --volume "${CI_MODEL_PATH}:/model:ro" \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --workdir "${GITHUB_WORKSPACE}" \
            --env SLIME_ROOT \
            --env HCU_MEGATRON_ROOT \
            --env DATA_ROOT \
            --env MODEL_PATH \
            --env SAVE_ROOT \
            --env LOG_DIR \
            --env NODE_IP \
            --env NUM_GPUS \
            --env HIP_VISIBLE_DEVICES \
            --env NUM_ROLLOUT \
            --env ROLLOUT_BATCH_SIZE \
            --env N_SAMPLES_PER_PROMPT \
            --env N_SAMPLES_PER_EVAL_PROMPT \
            --env GLOBAL_BATCH_SIZE \
            --env ROLLOUT_MAX_RESPONSE_LEN \
            --env EVAL_MAX_RESPONSE_LEN \
            --env WANDB_MODE \
            --env TOKENIZERS_PARALLELISM \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env XDG_CACHE_HOME=/tmp/slime-hcu-cache \
            --env HOST_UID="$(id -u)" \
            --env HOST_GID="$(id -g)" \
            "${CI_IMAGE}" \
            bash hcu_example/run_hcu_ci.sh smoke

      - name: Upload HCU smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slime-das-hcu-qwen3-4b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.hcu-smoke/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Clean HCU smoke state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="${GITHUB_WORKSPACE}/.hcu-smoke/${{ github.run_id }}-${{ github.run_attempt }}"
          if [[ -d "${smoke_root}" ]] && docker image inspect "${CI_IMAGE}" >/dev/null 2>&1; then
            docker run --rm --pull=never \
              --volume "${smoke_root}:/ci-output" \
              --env HOST_UID="$(id -u)" \
              --env HOST_GID="$(id -g)" \
              "${CI_IMAGE}" \
              bash -c 'rm -rf -- /ci-output/checkpoints /ci-output/cache; chown -R "${HOST_UID}:${HOST_GID}" /ci-output'
          fi
          rm -rf -- "${smoke_root}"
