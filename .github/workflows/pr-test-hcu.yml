name: PR Test (HCU)

on:
  # Label-triggered: a maintainer adding `run-ci` starts HCU PR CI. Opening,
  # pushing, reopening or marking the PR ready for review no longer does.
  pull_request_target:
    types: [labeled]
    branches:
      - main
    paths:
      - "slime/**"
      - "slime_plugins/**"
      - "hcu_example/**"
      - "scripts/**"
      - "tools/**"
      - "train.py"
      - "train_async.py"
      - "requirements.txt"
      - "setup.py"
      - ".github/workflows/pr-test-hcu.yml"
      - ".github/workflows/README.md"
  workflow_dispatch:

concurrency:
  # Unrelated label events get a throwaway group: they skip every job and must
  # not cancel or queue behind the HCU run they share a PR with.
  group: pr-test-hcu-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'run-ci' && github.run_id || 'checks' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hcu-qwen3-4b-smoke:
    name: HCU Qwen3-4B single-node smoke
    # HCU CI runs only when `run-ci` is added (the workflow accepts no other
    # PR event); draft pull requests are still skipped.
    if: github.event_name != 'pull_request_target' || (github.event.label.name == 'run-ci' && github.event.pull_request.draft == false)
    # ARC K8s pool: the job template injects the eight HCU devices, /dev/shm,
    # /opt/hyhal, /public and /ci_public, and the job runs inside the HCU image
    # (no docker-in-job).
    runs-on: hygon-bw1100-8card
    timeout-minutes: 60
    container:
      image: ${{ vars.HCU_BASE_IMAGE }}
    env:
      CI_MODEL_PATH: ${{ vars.CI_MODEL_PATH }}
      SLIME_ROOT: ${{ github.workspace }}
      HCU_MEGATRON_ROOT: /opt/hcu-megatron
      DATA_ROOT: /opt/slime-data
      # The model directory is read directly from the pod mount, not bind-mounted
      # from a host path the way the old docker launcher did.
      MODEL_PATH: ${{ vars.CI_MODEL_PATH }}
      SAVE_ROOT: ${{ github.workspace }}/.hcu-smoke/${{ github.run_id }}-${{ github.run_attempt }}/checkpoints
      LOG_DIR: ${{ github.workspace }}/.hcu-smoke/${{ github.run_id }}-${{ github.run_attempt }}/logs
      NODE_IP: "127.0.0.1"
      NUM_GPUS: "8"
      HIP_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      NUM_ROLLOUT: "1"
      ROLLOUT_BATCH_SIZE: "1"
      N_SAMPLES_PER_PROMPT: "1"
      N_SAMPLES_PER_EVAL_PROMPT: "1"
      GLOBAL_BATCH_SIZE: "1"
      ROLLOUT_MAX_RESPONSE_LEN: "256"
      EVAL_MAX_RESPONSE_LEN: "256"
      WANDB_MODE: disabled
      TOKENIZERS_PARALLELISM: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      XDG_CACHE_HOME: /tmp/slime-hcu-cache

    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CI_MODEL_PATH; do
            test -n "${!name:-}" || {
              echo "::error::Repository variable ${name} is not configured."
              exit 2
            }
          done
          test -f "${CI_MODEL_PATH}/config.json" || {
            echo "::error::Model config is not readable: ${CI_MODEL_PATH}/config.json"
            exit 2
          }
          python3 -c 'import torch; count = torch.cuda.device_count(); print(f"devices={count}"); assert count >= 8'

      - name: Run Qwen3-4B minimum rollout and training step
        shell: bash
        run: bash hcu_example/run_hcu_ci.sh smoke

      - name: Upload HCU smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slime-das-hcu-qwen3-4b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.hcu-smoke/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Clean HCU smoke state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="${GITHUB_WORKSPACE}/.hcu-smoke/${{ github.run_id }}-${{ github.run_attempt }}"
          rm -rf -- "${smoke_root}/checkpoints" "${smoke_root}/cache"
