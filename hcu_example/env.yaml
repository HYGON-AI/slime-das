env_vars:
  PATH: "/opt/hyhal/bin:/opt/dtk/hip/bin:/opt/dtk/bin:/usr/local/bin:/usr/bin:/bin"
  LD_LIBRARY_PATH: "/opt/dtk/dcc/gcvm/lib:/opt/dtk/hip/lib:/opt/dtk/llvm/lib:/opt/dtk/lib:/opt/dtk/lib64:/opt/hyhal/lib:/opt/hyhal/lib64:/opt/dtk/dushmem/lib:/opt/dtk/opencl/lib:/usr/local/lib:/usr/local/lib64:/opt/mpi/lib:/opt/hwloc/lib:/opt/ucx/lib"
  PYTHONBUFFERED: "16"

  # PYTHONPATH and cache paths are inherited from common_env.sh.

  GLOG_minloglevel: "3"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  HSA_FORCE_FINE_GRAIN_PCIE: "1"
  OMP_NUM_THREADS: "1"
  HIP_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
  RAY_EXPERIMENTAL_NOSET_HIP_VISIBLE_DEVICES: "1"

  USE_HCU_CUSTOM_ALLREDUCE: "1"
  SGLANG_ENABLE_JIT_DEEPGEMM: "0"
  SGLANG_KVALLOC_KERNEL: "1"
  SGLANG_CHUNKED_PREFIX_CACHE_THRESHOLD: "0"
  GPU_MAX_HW_QUEUES: "3"
  HIP_KERNEL_BATCH_CEILING: "100"
  HSA_KERNARG_POOL_SIZE: "8388608"
  ROC_AQL_QUEUE_SIZE: "131072"
  GLIBC_TUNABLES: "glibc.rtld.optional_static_tls=0x40000"

  HIP_H2D_DISABLE_COPY_BUFFER: "0"
  HIP_D2H_DISABLE_COPY_BUFFER: "0"
  HIP_H2D_DIRECT_COPY_THRESHOLD: "32768"
  HIP_H2D_HSAAPI_COPY_THRESHOLD: "32768"
  HIP_D2H_DIRECT_COPY_THRESHOLD: "512"
  HIP_D2H_HSAAPI_COPY_THRESHOLD: "512"

  NCCL_ALGO: "Ring"
  NCCL_MAX_NCHANNELS: "16"
  NCCL_MIN_NCHANNELS: "16"
  RCCL_SDMA_COPY_ENABLE: "0"
  ALLREDUCE_STREAM_WITH_COMPUTE: "1"

